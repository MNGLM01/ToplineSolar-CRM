# Nightly database backup for the Supabase free plan (which has no automatic backups).
# Saves a full dump as a GitHub Actions artifact, kept for 30 days.
# Needs one repository secret: SUPABASE_DB_URL (Supabase → Project Settings → Database → Connection string, "Session pooler" URI with password).
name: Nightly backup
on:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST every night
  workflow_dispatch: {}
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump database
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          STAMP=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          /usr/lib/postgresql/17/bin/pg_dump "$DB" --no-owner --no-privileges --schema=public --schema=auth -Fc -f "topline-crm-$STAMP.dump"
          ls -lh topline-crm-*.dump
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: topline-crm-*.dump
          retention-days: 30
